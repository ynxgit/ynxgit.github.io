<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media — NexDrive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black:   #0a0a0c;
    --surface: #111116;
    --card:    #15151d;
    --card2:   #1a1a24;
    --border:  #22222e;
    --border2: #2e2e3e;
    --text:    #ededf0;
    --muted:   #606075;
    --sub:     #8888a4;
    --purple:  #9b6dff;
    --purple2: #7c4fe0;
    --purple3: #5c36b0;
    --pink:    #e040a0;
    --pink2:   #b8307a;
    --pink3:   #8a2260;
    --glow-p:  rgba(155,109,255,0.15);
    --glow-pk: rgba(224,64,160,0.12);
    --accent:  linear-gradient(135deg, #7c4fe0, #b8307a);
    --radius:  14px;
    --nav-w:   240px;
  }

  html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--black); color: var(--text); -webkit-font-smoothing: antialiased; }
  body { display: flex; min-height: 100vh; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--nav-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    left: 0; top: 0; bottom: 0;
    z-index: 20;
    transition: transform .3s;
  }

  .sidebar-top {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: inherit;
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 700; color: #fff;
  }
  .logo-name { font-size: 1rem; font-weight: 600; letter-spacing: -0.01em; }

  nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

  .nav-section-label {
    font-size: .68rem; font-weight: 600; letter-spacing: .08em;
    color: var(--muted); padding: 12px 8px 4px; text-transform: uppercase;
  }

  .nav-link {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 10px;
    text-decoration: none; color: var(--sub);
    font-size: .875rem; font-weight: 400;
    transition: background .15s, color .15s;
    cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    font-family: inherit;
  }
  .nav-link:hover { background: rgba(155,109,255,.08); color: var(--text); }
  .nav-link.active {
    background: rgba(155,109,255,.14);
    color: var(--purple);
    font-weight: 500;
  }
  .nav-link.active .nav-icon { color: var(--purple); }
  .nav-icon { font-size: 1.1rem; width: 20px; text-align: center; flex-shrink: 0; }

  .sidebar-user {
    padding: 16px 12px;
    border-top: 1px solid var(--border);
  }
  .user-widget {
    display: flex; align-items: center; gap: 10px;
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: background .15s;
    position: relative;
  }
  .user-widget:hover { background: rgba(155,109,255,.08); }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--purple2);
    object-fit: cover;
  }
  .avatar-placeholder {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: .9rem; font-weight: 600; color: #fff;
    border: 1.5px solid var(--purple2);
  }
  .user-info { flex: 1; min-width: 0; }
  .user-name { font-size: .85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-role { font-size: .72rem; color: var(--muted); }
  .user-menu-btn { color: var(--muted); font-size: 1rem; line-height: 1; }

  #user-dropdown {
    position: absolute; bottom: 60px; left: 12px; right: 12px;
    background: var(--card2); border: 1px solid var(--border2);
    border-radius: 12px; padding: 6px;
    display: none; z-index: 30;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
  }
  #user-dropdown.open { display: block; }
  .dropdown-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    font-size: .85rem; color: var(--sub);
    cursor: pointer; transition: background .15s, color .15s;
  }
  .dropdown-item:hover { background: rgba(155,109,255,.08); color: var(--text); }
  .dropdown-item.danger:hover { color: #ff5c7a; background: rgba(255,92,122,.08); }
  .dropdown-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* ── Main content ── */
  #main {
    margin-left: var(--nav-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Top bar ── */
  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 28px;
    height: 64px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,10,12,.6);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 10;
  }
  #topbar h1 { font-size: 1rem; font-weight: 500; }

  .search-box {
    flex: 1; max-width: 400px;
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
  }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: .875rem;
    font-family: inherit;
    outline: none;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-box .search-icon { color: var(--muted); font-size: 1rem; }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 9px;
    background: transparent; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); font-size: 1rem;
    transition: all .15s;
  }
  .icon-btn:hover { border-color: var(--purple); color: var(--purple); background: rgba(155,109,255,.07); }

  /* ── Page content ── */
  #page { flex: 1; padding: 28px; overflow-y: auto; }

  /* ── Video grid (YouTube-like) ── */
  .media-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .video-card {
    cursor: pointer;
    transition: transform .2s;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .video-card:hover { transform: translateY(-4px); }
  .video-card:hover .thumbnail { border-color: var(--purple); }

  .thumbnail {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .2s;
  }

  .thumbnail-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumbnail-icon {
    font-size: 2.5rem;
    z-index: 1;
  }

  .thumbnail-overlay {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,.8);
    color: #fff;
    font-size: .75rem;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
  }

  .video-info { padding: 0 4px; }
  .video-title {
    font-size: .875rem;
    font-weight: 500;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-meta {
    font-size: .75rem;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    gap: 2px;
    line-height: 1.3;
  }
  .video-meta-item { display: flex; gap: 6px; }
  .video-meta-item strong { color: var(--sub); }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 16px; }
  .empty-title { font-size: 1.1rem; font-weight: 500; margin-bottom: 8px; }
  .empty-sub { font-size: .9rem; color: var(--sub); }

  /* ── Loading ── */
  .loading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .skeleton-card { display: flex; flex-direction: column; gap: 10px; }
  .skeleton-thumb {
    width: 100%;
    padding-bottom: 56.25%;
    background: var(--card);
    border-radius: 12px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .skeleton-title {
    height: 14px;
    background: var(--card);
    border-radius: 6px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .skeleton-meta {
    height: 11px;
    background: var(--card);
    border-radius: 6px;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

  /* ── Media player modal ── */
  #player-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #player-modal.open {
    display: flex;
  }

  .player-container {
    width: 100%;
    max-width: 920px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .player-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .player-title {
    font-size: 1rem;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .player-close {
    background: none;
    border: none;
    color: var(--text);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    transition: color .2s;
  }
  .player-close:hover { color: var(--purple); }

  #video-player, #audio-player {
    width: 100%;
    border-radius: 12px;
    background: #000;
    max-height: 65vh;
  }

  /* ── Mobile sidebar toggle ── */
  #menu-toggle {
    display: none;
    position: fixed; top: 16px; left: 16px; z-index: 30;
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.2rem; color: var(--sub);
  }
  #sidebar-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.5); z-index: 15;
  }

  @media (max-width: 768px) {
    #sidebar { transform: translateX(-100%); }
    #sidebar.open { transform: translateX(0); }
    #sidebar-overlay.open { display: block; }
    #main { margin-left: 0; }
    #menu-toggle { display: flex; }
    #topbar { padding-left: 64px; }
    .media-grid { grid-template-columns: 1fr; }
    .search-box { max-width: none; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<button id="menu-toggle" onclick="toggleSidebar()" aria-label="Menu">☰</button>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sidebar-top">
    <a class="logo" href="home.html">
      <div class="logo-mark">⬡</div>
      <span class="logo-name">NexDrive</span>
    </a>
  </div>

  <nav>
    <div class="nav-section-label">Navigation</div>
    <a class="nav-link" href="home.html">
      <span class="nav-icon">🏠</span> Home
    </a>
    <a class="nav-link active" href="media.html">
      <span class="nav-icon">🎬</span> Media
    </a>
    <a class="nav-link" href="game.html">
      <span class="nav-icon">🎮</span> Games
    </a>
    <a class="nav-link" href="code.html">
      <span class="nav-icon">💻</span> Code
    </a>

    <div class="nav-section-label" style="margin-top:8px">Files</div>
    <a class="nav-link" href="home.html?view=files">
      <span class="nav-icon">📁</span> File Browser
    </a>
    <a class="nav-link" href="home.html?view=files&path=media">
      <span class="nav-icon">📽️</span> Media Files
    </a>
  </nav>

  <div class="sidebar-user">
    <div id="user-dropdown">
      <div class="dropdown-item" onclick="goToProfile()">👤 &nbsp;Profile</div>
      <div class="dropdown-item" onclick="goToFiles()">📁 &nbsp;My files</div>
      <div class="dropdown-sep"></div>
      <div class="dropdown-item danger" onclick="doLogout()">🚪 &nbsp;Sign out</div>
    </div>
    <div class="user-widget" onclick="toggleUserMenu()">
      <div id="sidebar-avatar"></div>
      <div class="user-info">
        <div class="user-name" id="sidebar-name">Loading…</div>
        <div class="user-role">Member</div>
      </div>
      <span class="user-menu-btn">⋯</span>
    </div>
  </div>
</aside>

<!-- Main -->
<div id="main">
  <header id="topbar">
    <div>
      <h1>Media Library</h1>
    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="search" id="search-input" placeholder="Search videos, music, photos…" onkeydown="if(event.key==='Enter') doSearch()">
    </div>
    <div class="topbar-right">
      <button class="icon-btn" title="Refresh" onclick="loadMedia()">🔄</button>
    </div>
  </header>

  <main id="page">
    <div id="media-grid" class="media-grid">
      <!-- Loading skeletons -->
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-title"></div><div class="skeleton-meta"></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-title"></div><div class="skeleton-meta"></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-title"></div><div class="skeleton-meta"></div></div>
      <div class="skeleton-card"><div class="skeleton-thumb"></div><div class="skeleton-title"></div><div class="skeleton-meta"></div></div>
    </div>
  </main>
</div>

<!-- Player Modal -->
<div id="player-modal">
  <div class="player-container">
    <div class="player-header">
      <div class="player-title" id="player-title">Loading…</div>
      <button class="player-close" onclick="closePlayer()">✕</button>
    </div>
    <video id="video-player" controls style="display:none"></video>
    <audio id="audio-player" controls style="display:none"></audio>
  </div>
</div>

<script>
// ── Session ──────────────────────────────────────────────────────────────────
const TOKEN   = sessionStorage.getItem('nx_token');
const SERVER  = (sessionStorage.getItem('nx_server') || '').replace(/\/$/, '');
const DISPLAY = sessionStorage.getItem('nx_display') || 'User';
const PFP     = sessionStorage.getItem('nx_pfp') || '';

if (!TOKEN || !SERVER) {
  window.location.href = 'index.html';
}

function api(path, params = {}) {
  const url = new URL(SERVER + path);
  url.searchParams.set('token', TOKEN);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  return fetch(url.toString()).then(r => r.json());
}

// ── Sidebar user ──────────────────────────────────────────────────────────────
(function initUser() {
  document.getElementById('sidebar-name').textContent = DISPLAY;
  const wrap = document.getElementById('sidebar-avatar');
  if (PFP) {
    wrap.innerHTML = `<img class="avatar" src="${PFP}" alt="">`;
  } else {
    const init = (DISPLAY || '?')[0].toUpperCase();
    wrap.innerHTML = `<div class="avatar-placeholder">${init}</div>`;
  }
})();

// ── User menu ──────────────────────────────────────────────────────────────
function toggleUserMenu() {
  document.getElementById('user-dropdown').classList.toggle('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.sidebar-user')) {
    document.getElementById('user-dropdown').classList.remove('open');
  }
});
function goToProfile() { alert('Profile page coming soon!'); }
function goToFiles()   { window.location.href = 'home.html?view=files'; }
function doLogout() {
  fetch(SERVER + '/api/logout', { method:'POST', headers:{'X-Auth-Token': TOKEN} }).catch(()=>{});
  sessionStorage.clear();
  window.location.href = 'index.html';
}

// ── Sidebar mobile ────────────────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

// ── Media helpers ─────────────────────────────────────────────────────────────
const _mediaCache = {};
let _currentQuery = '';

function getMediaIcon(mime) {
  if (!mime) return '📄';
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  if (mime.startsWith('image/')) return '🖼️';
  return '📄';
}

function formatDate(timestamp) {
  const d = new Date(timestamp * 1000);
  const now = new Date();
  const diff = now - d;
  const days = Math.floor(diff / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return `${days}d ago`;
  if (days < 30) return `${Math.floor(days / 7)}w ago`;
  if (days < 365) return `${Math.floor(days / 30)}m ago`;
  return `${Math.floor(days / 365)}y ago`;
}

function humanSize(bytes) {
  for (const [unit, div] of [['GB', 1e9], ['MB', 1e6], ['KB', 1e3]]) {
    if (bytes >= div) return (bytes / div).toFixed(1) + ' ' + unit;
  }
  return bytes + ' B';
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderMedia(entries) {
  const grid = document.getElementById('media-grid');
  
  if (!entries.length) {
    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">
        <div class="empty-icon">📁</div>
        <div class="empty-title">No media found</div>
        <div class="empty-sub">D:\\media is empty or hasn't loaded yet</div>
      </div>
    `;
    return;
  }

  grid.innerHTML = entries
    .filter(e => {
      const m = e.mime || '';
      return m.startsWith('video/') || m.startsWith('audio/') || m.startsWith('image/');
    })
    .map((e, idx) => {
      _mediaCache[idx] = e;
      const icon = getMediaIcon(e.mime);
      const dateStr = formatDate(e.modified);
      const sizeStr = e.size_human || humanSize(e.size);
      
      return `
        <a class="video-card" onclick="openMedia(${idx}); return false;">
          <div class="thumbnail">
            <div class="thumbnail-icon">${icon}</div>
            <div class="thumbnail-overlay" style="display:${e.mime?.startsWith('video/') ? 'block' : 'none'}">▶ VIDEO</div>
          </div>
          <div class="video-info">
            <div class="video-title">${e.name}</div>
            <div class="video-meta">
              <div class="video-meta-item"><strong>${sizeStr}</strong></div>
              <div class="video-meta-item"><strong>${dateStr}</strong></div>
            </div>
          </div>
        </a>
      `;
    }).join('');
}

// ── Load media ─────────────────────────────────────────────────────────────
async function loadMedia() {
  try {
    const data = await api('/api/browse', { path: 'media' });
    if (data.error) {
      document.getElementById('media-grid').innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)">
          <div class="empty-icon">⚠️</div>
          <div class="empty-title">${data.error}</div>
        </div>
      `;
      return;
    }
    renderMedia(data.entries || []);
  } catch (e) {
    console.error('Failed to load media:', e);
  }
}

// ── Search ────────────────────────────────────────────────────────────────────
async function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  if (!query) {
    _currentQuery = '';
    loadMedia();
    return;
  }

  _currentQuery = query;
  try {
    const data = await api('/api/search', { q: query, path: 'media' });
    if (data.error) {
      renderMedia([]);
      return;
    }
    renderMedia(data.results || []);
  } catch (e) {
    console.error('Search failed:', e);
  }
}

// ── Player ────────────────────────────────────────────────────────────────────
function openMedia(idx) {
  const e = _mediaCache[idx];
  if (!e) return;

  const modal = document.getElementById('player-modal');
  const video = document.getElementById('video-player');
  const audio = document.getElementById('audio-player');
  
  video.pause(); video.src = ''; video.style.display = 'none';
  audio.pause(); audio.src = ''; audio.style.display = 'none';

  const url = `${SERVER}/api/stream?path=${encodeURIComponent(e.path)}&token=${TOKEN}`;
  document.getElementById('player-title').textContent = e.name;

  if (e.mime.startsWith('video/')) {
    video.src = url;
    video.style.display = 'block';
    video.play().catch(err => console.error('Play error:', err));
  } else if (e.mime.startsWith('audio/')) {
    audio.src = url;
    audio.style.display = 'block';
    audio.play().catch(err => console.error('Play error:', err));
  }

  modal.classList.add('open');
}

function closePlayer() {
  document.getElementById('video-player').pause();
  document.getElementById('audio-player').pause();
  document.getElementById('player-modal').classList.remove('open');
}

// Close on Escape
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePlayer();
});

// ── Boot ──────────────────────────────────────────────────────────────────────
loadMedia();
</script>
</body>
</html>
